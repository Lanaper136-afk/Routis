    <script>
// ======================= tiny pseudo-3D engine =======================
    const W = 960, H = 540, CAM_H = 1.25, CAM_X = -1.75;           // driver sits in the left lane (driving on the left)
    const F = W * 1.25, HY = H * 0.45;                               // focal length, horizon line
    const lerp = (a, b, k) => a + (b - a) * k;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // object position from waypoints [{t,x,z}] (linear between them, held outside)
    function posAt(o, t) {
      const w = o.path;
      if (t <= w[0].t) return { x: w[0].x, z: w[0].z, walk: false };
      for (let i = 1; i < w.length; i++) {
        if (t <= w[i].t) { const k = (t - w[i - 1].t) / (w[i].t - w[i - 1].t || 1); return { x: lerp(w[i - 1].x, w[i].x, k), z: lerp(w[i - 1].z, w[i].z, k), walk: w[i].x !== w[i - 1].x || w[i].z !== w[i - 1].z }; }
      }
      const l = w[w.length - 1]; return { x: l.x, z: l.z, walk: false };
    }
    const sx = (x, dz) => W / 2 + (x - CAM_X) * F / dz;
    const sy = (h, dz) => HY + (CAM_H - h) * F / dz;

    function poly(c, pts, fill, stroke) { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.stroke(); } }
    // vertical wall between two depths on a plane x, from height h0 to h1
    function wall(c, x, z1, z2, h0, h1, fill, camZ) {
      const d1 = z1 - camZ, d2 = z2 - camZ; if (d2 < 1.5) return; const a = Math.max(d1, 1.5);
      poly(c, [[sx(x, a), sy(h0, a)], [sx(x, d2), sy(h0, d2)], [sx(x, d2), sy(h1, d2)], [sx(x, a), sy(h1, a)]], fill);
    }
    // flat strip on the ground between x0..x1, depths z1..z2
    function strip(c, x0, x1, z1, z2, fill, camZ) {
      const a = Math.max(z1 - camZ, 1.2), b = z2 - camZ; if (b < 1.2) return;
      poly(c, [[sx(x0, a), sy(0, a)], [sx(x1, a), sy(0, a)], [sx(x1, b), sy(0, b)], [sx(x0, b), sy(0, b)]], fill);
    }

    // ---- sprites (drawn at ground point; s = pixels per metre) ----
    function shadow(c, x, y, w) { c.fillStyle = "rgba(0,0,0,.28)"; c.beginPath(); c.ellipse(x, y, w * 0.55, w * 0.1, 0, 0, 7); c.fill(); }
    function carRear(c, x, y, s, col, blink, front) {
      const w = 1.8 * s, h = 1.45 * s; shadow(c, x, y, w);
      c.fillStyle = col; c.fillRect(x - w / 2, y - 0.95 * s, w, 0.7 * s);
      poly(c, [[x - w * 0.4, y - 0.95 * s], [x - w * 0.3, y - h], [x + w * 0.3, y - h], [x + w * 0.4, y - 0.95 * s]], col);
      c.fillStyle = "#1c2733"; poly(c, [[x - w * 0.34, y - 0.97 * s], [x - w * 0.26, y - h * 0.97], [x + w * 0.26, y - h * 0.97], [x + w * 0.34, y - 0.97 * s]], "#1c2733");
      c.fillStyle = "#111"; c.fillRect(x - w / 2 + 0.05 * s, y - 0.3 * s, 0.34 * s, 0.34 * s); c.fillRect(x + w / 2 - 0.39 * s, y - 0.3 * s, 0.34 * s, 0.34 * s);
      lights(c, x, y, s, w, front, blink);
    }
    function lights(c, x, y, s, w, front, blink) {
      const on = blink && blink.on, br = blink && blink.brake;
      const base = front ? "#fff6c8" : (br ? "#ff2a2a" : "#a41818");
      c.fillStyle = base; c.fillRect(x - w / 2 + 0.04 * s, y - 0.72 * s, 0.3 * s, 0.14 * s); c.fillRect(x + w / 2 - 0.34 * s, y - 0.72 * s, 0.3 * s, 0.14 * s);
      if (br) { c.fillStyle = "rgba(255,40,40,.35)"; c.beginPath(); c.arc(x - w / 2 + 0.2 * s, y - 0.65 * s, 0.35 * s, 0, 7); c.arc(x + w / 2 - 0.2 * s, y - 0.65 * s, 0.35 * s, 0, 7); c.fill(); }
      if (on) { c.fillStyle = "#ffb000"; const ox = blink.side === "L" ? x - w / 2 - 0.05 * s : x + w / 2 - 0.15 * s; c.fillRect(ox, y - 0.58 * s, 0.2 * s, 0.14 * s); }
    }
    function vanRear(c, x, y, s, col, blink, front) {
      const w = 2.0 * s, h = 2.3 * s; shadow(c, x, y, w);
      c.fillStyle = col; c.fillRect(x - w / 2, y - h, w, h - 0.25 * s);
      c.fillStyle = "#2a3b4d"; c.fillRect(x - w * 0.36, y - h * 0.9, w * 0.72, h * 0.36);

    }
    function busFront(c, x, y, s) {
      const w = 2.5 * s, h = 3.2 * s; shadow(c, x, y, w);
      c.fillStyle = "#2f6db3"; c.fillRect(x - w / 2, y - h, w, h - 0.3 * s);
      c.fillStyle = "#273a4d"; c.fillRect(x - w * 0.44, y - h * 0.93, w * 0.88, h * 0.4);
      c.fillStyle = "#f5e9a0"; c.fillRect(x - w * 0.4, y - h * 0.4, w * 0.16, w * 0.1); c.fillRect(x + w * 0.24, y - h * 0.4, w * 0.16, w * 0.1);
      c.fillStyle = "#111"; c.fillRect(x - w * 0.46, y - 0.35 * s, 0.4 * s, 0.35 * s); c.fillRect(x + w * 0.46 - 0.4 * s, y - 0.35 * s, 0.4 * s, 0.35 * s);
      c.fillStyle = "#ffd23c"; c.fillRect(x - w * 0.3, y - h * 0.97, w * 0.6, h * 0.05);
    }
    function person(c, x, y, s, t, col, hgt, walk) {
      const k = hgt || 1.7, sw = walk ? Math.sin(t * 8) : 0;
      shadow(c, x, y, 0.7 * s);

  c.fillStyle = "#0e1014"; c.fillRect(0, 0, W, 6);
}

const app = document.getElementById("hz");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let run = null, raf = null, view = "intro", curHint = false;

function applyHead() { const u = U(); document.getElementById("h1").textContent = u.h1; document.getElementById("intro").textContent = u.intro; document.getElementById("back").textContent = u.home; }
function intro() {
  cancelAnimationFrame(raf); run = null; view = "intro"; applyHead();
  const u = U(), best = store.get("frBestHazard");
  app.innerHTML = '<div class="panel"><p><strong>' + u.how + '</strong></p><ol class="how">' + u.steps.map((s) => "<li>" + s.replace("%N%", SCENES.length) + "</li>").join("") + '</ol><p class="note">' + u.note + '</p>' + (best ? "<p>" + u.best + " <strong>" + best + " / " + SCENES.length * 5 + "</strong></p>" : "") + '<button class="btn" id="go">' + u.start + '</button></div>';
  document.getElementById("go").onclick = () => startRun();
}
function startRun() { run = { i: 0, pts: [] }; playScene(); }

function playScene(hint) {
  cancelAnimationFrame(raf); view = "play"; curHint = !!hint;
  const sc = SCENES[run.i], u = U(), tx = T(sc.id);
  app.innerHTML = '<div class="hud"><span>' + u.scene + " " + (run.i + 1) + " / " + SCENES.length + " · " + tx.title + '</span><span id="st">' + (hint ? u.watch : u.click) + '</span></div><div class="stage" id="stage"><canvas id="cv" width="' + W + '" height="' + H + '" role="img" aria-label="' + u.tap + '"></canvas><div class="tap" id="tapnote">' + (hint ? "" : u.tap) + '</div></div><div id="below"></div>';
  const cv = document.getElementById("cv"), c = cv.getContext("2d"), stage = document.getElementById("stage");
  const clicks = []; let t0 = performance.now(), done = false;
  const TS = parseFloat(new URLSearchParams(location.search).get("ts") || "1") || 1;
  const nowT = () => Math.min(sc.dur, ((performance.now() - t0) / 1000) * TS);
  function mark(ev) {
    if (done || hint) return; const t = nowT(); clicks.push(t);
    const r = stage.getBoundingClientRect(); const f = document.createElement("div"); f.className = "flash";
    f.style.left = ((ev && ev.clientX != null ? ev.clientX - r.left : r.width / 2)) + "px"; f.style.top = ((ev && ev.clientY != null ? ev.clientY - r.top : r.height / 2)) + "px"; stage.appendChild(f); setTimeout(() => f.remove(), 520);
  }
  stage.addEventListener("pointerdown", mark);
  const key = (e) => { if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); mark(null); } };
  document.addEventListener("keydown", key);
  function frame() { const t = nowT(); render(c, sc, t, hint); if (t >= sc.dur) { finishScene(); return; } raf = requestAnimationFrame(frame); }
  function finishScene() {
    if (done) return; done = true; document.removeEventListener("keydown", key); stage.removeEventListener("pointerdown", mark);
    const tapn = document.getElementById("tapnote"); if (tapn) tapn.remove();
    let pts = 0, note = "";
    if (!hint) {
      const hz = sc.hazard, dur = hz.end - hz.start;
      if (clicks.length > 5) { note = u.many; }
      else {
        const inside = clicks.filter((t) => t >= hz.start && t <= hz.end);
        if (inside.length) { pts = 5 - Math.min(4, Math.floor(5 * (inside[0] - hz.start) / dur)); note = u.reacted((inside[0] - hz.start).toFixed(1)); }
        else if (clicks.some((t) => t < hz.start)) note = u.early;
        else if (clicks.length) note = u.late;
        else note = u.none;
      }
      run.pts[run.i] = pts;
    }
    const pc = run.pts[run.i] || 0, hz = sc.hazard;
    const tl = '<div class="tl" aria-hidden="true"><div class="win" style="left:' + (100 * hz.start / sc.dur) + '%;width:' + (100 * (hz.end - hz.start) / sc.dur) + '%"></div>' + (hint ? "" : clicks.map((t) => '<div class="clk" style="left:' + (100 * t / sc.dur) + '%"></div>').join("")) + '</div><div class="tl-cap">' + u.tlcap + '</div>';
    const below = document.getElementById("below");
    below.innerHTML = '<div class="panel"><div class="pts ' + (pc >= 3 ? "good" : pc >= 1 ? "" : "bad") + '">' + pc + ' / 5</div><p class="n"></p>' + tl + '<p><strong>' + u.hazard + '</strong> <span class="w"></span>.</p><p class="e"></p><p><small class="r"></small></p><button class="btn ghost" id="again">' + u.again + '</button> <button class="btn" id="next">' + (run.i === SCENES.length - 1 ? u.res : u.next) + '</button></div>';
    below.querySelector(".n").textContent = hint ? "" : note; below.querySelector(".w").textContent = tx.what; below.querySelector(".e").textContent = tx.explain; below.querySelector(".r").textContent = tx.rule;
    document.getElementById("again").onclick = () => playScene(true);
    document.getElementById("next").onclick = () => { run.i++; if (run.i >= SCENES.length) results(); else playScene(); };
  }
  raf = requestAnimationFrame(frame);
}
function results() {
  cancelAnimationFrame(raf); view = "res"; const u = U();
  const total = run.pts.reduce((a, b) => a + (b || 0), 0), max = SCENES.length * 5;
  const b = parseInt(store.get("frBestHazard") || "0", 10); if (total > b) store.set("frBestHazard", String(total));
  app.innerHTML = '<div class="panel"><h2 style="margin-top:0">' + u.score + " " + total + " / " + max + '</h2><ul>' + SCENES.map((s, i) => "<li>" + T(s.id).title + " : " + (run.pts[i] || 0) + " / 5</li>").join("") + '</ul><button class="btn" id="redo">' + u.retry + '</button></div>';
  document.getElementById("redo").onclick = () => startRun();
}
document.querySelectorAll(".lang-option").forEach((btn) => btn.addEventListener("click", () => { if (btn.dataset.lang === getLang()) return; setLang(btn.dataset.lang); applyStaticTranslations(); if (view === "intro") intro(); else if (view === "res") results(); else applyHead(); }));
(function () {
  const q = new URLSearchParams(location.search);
  if (!q.has("scene")) { applyStaticTranslations(); intro(); return; }
  const sc = SCENES[parseInt(q.get("scene"), 10)], t = parseFloat(q.get("t") || "0");
  app.innerHTML = '<div class="stage"><canvas id="cv" width="' + W + '" height="' + H + '"></canvas></div>';
  render(document.getElementById("cv").getContext("2d"), sc, t, q.get("hint") === "1");
})();

    </script>
