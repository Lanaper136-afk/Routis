name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          URL="https://wzsfwejmfxuuzljjavdb.supabase.co"
          KEY="sb_publishable_7vJT0UV984mM983Iaiv3wg_xnQQul8i"
          curl -fsS "$URL/rest/v1/progress?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          curl -fsS "$URL/auth/v1/health" -H "apikey: $KEY"
